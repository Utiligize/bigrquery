# zizmor configuration for Utiligize/bigrquery
#
# The org-wide GitHub Actions audit (Utiligize/infrastructure,
# scripts/audit-actions) runs zizmor with --persona=auditor and deep-merges
# this file over its baseline config.
#
# secrets-outside-env asks every job that touches the secrets context to
# declare a GitHub Environment. This repository defines no environments
# (verified via GET /repos/Utiligize/bigrquery/environments), so the rule's
# remediation does not apply. Drop the entries below if environments are
# introduced later.
rules:
  secrets-outside-env:
    ignore:
      - live-api.yml
      - test-coverage.yaml
